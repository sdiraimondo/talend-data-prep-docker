# Compose v2 (sans champ `version`, deprecate).
# Un seul service : le Dockerfile multi-arch gere amd64 ET arm64,
# plus besoin des anciens profils x86 / arm64 separes.

services:
  extract-discovery:
    build:
      context: .
      dockerfile: Dockerfile
    image: pontusvision-extract-discovery:latest
    container_name: extract-discovery
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
