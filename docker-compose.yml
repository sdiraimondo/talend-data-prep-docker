version: "3.8"

services:
  extract-discovery:
    build:
      context: .
      dockerfile: Dockerfile
    image: pontusvision-extract-discovery:latest
    container_name: extract-discovery
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - extract-discovery-net

networks:
  extract-discovery-net:
    driver: bridge
